# OPCIONAL (recomendado): compila el .exe en Windows y crea el Release al
# empujar un tag "vX.Y.Z".  Puede requerir ajustes segun tu repo.
#   git tag v2.6.8 && git push origin v2.6.8
name: Build & Release EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m playwright install chromium

      - name: Compilar .exe v3 (principal)
        run: pyinstaller --noconfirm GeneradorSubmittalsES_v3.spec

      - name: Compilar .exe v2.6 (hermano legado)
        run: pyinstaller --noconfirm GeneradorSubmittalsES.spec

      - name: Crear Release con los .exe
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GeneradorSubmittalsES_v3.exe
            dist/GeneradorSubmittalsES.exe
